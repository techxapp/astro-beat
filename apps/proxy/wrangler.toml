# SPDX-License-Identifier: AGPL-3.0-or-later
name = "astro-beat-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

# Metadata-only logging; never enable Logpush for this worker.
[observability]
enabled = false

[vars]
ALLOWED_ORIGIN = "https://astro-beat.example"
OPENAI_MODEL = "gpt-5-mini"
DAILY_TOKEN_BUDGET = "2000000"
SOURCE_URL = "https://github.com/techxapp/astro-beat"
# COMMIT_SHA is injected at deploy time (see package.json "deploy").
COMMIT_SHA = "unknown"

# Secrets (wrangler secret put): OPENAI_API_KEY, SESSION_SECRET

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]
